name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange files
        run: |
          mkdir -p app/src/main/java/com/jarvis/app
          mv MainActivity.kt JarvisService.kt LiveClient.kt app/src/main/java/com/jarvis/app/
          mv AndroidManifest.xml app/src/main/
          mv app.gradle.kts app/build.gradle.kts
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: jarvis-apk, path: app/build/outputs/apk/debug/*.apk }
